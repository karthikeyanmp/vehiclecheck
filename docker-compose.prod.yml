# Full on-prem stack: Postgres + the app + Caddy (automatic HTTPS).
#
#   cp .env.example .env         # then fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Requires: the domain in .env pointing (A record) at this server's public IP,
# and ports 80 + 443 reachable from the internet (Caddy needs them to obtain
# and renew the Let's Encrypt certificate).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vehicle_permit
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: vehicle_permit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehicle_permit"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://vehicle_permit:${DB_PASSWORD}@db:5432/vehicle_permit
      DATABASE_SSL: "false"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}
      QR_JWT_SECRET: ${QR_JWT_SECRET:?set QR_JWT_SECRET in .env}
      EVENT_QR_EXPIRY: ${EVENT_QR_EXPIRY:?set EVENT_QR_EXPIRY in .env}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      PORT: "4000"
    volumes:
      - uploads:/app/server/uploads

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
