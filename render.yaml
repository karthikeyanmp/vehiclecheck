# Render Blueprint — deploys the whole platform as ONE web service (Express
# serving both the API and the bundled React client) plus a free Postgres.
#
# In the Render dashboard: New → Blueprint → connect this repo. Render reads
# this file and creates both resources. You'll be prompted to fill in the
# two BOOTSTRAP_ADMIN_* values (they're marked sync:false so they aren't
# stored in the repo).

databases:
  - name: vehicle-permit-db
    plan: free
    databaseName: vehicle_permit
    user: vehicle_permit
    region: singapore

services:
  - type: web
    name: vehicle-permit
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vehicle-permit-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: QR_JWT_SECRET
        generateValue: true
      - key: EVENT_QR_EXPIRY
        value: "2026-09-13T00:00:00+05:30"
      # Fill these in when prompted — creates the first admin login on first boot.
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
